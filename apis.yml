name: Sense Street
description: >-
  Sense Street provides production-grade AI workflow automation for capital
  markets, structuring unstructured OTC trading conversations in real time.
  Its platform connects to trading communication channels such as Bloomberg,
  Symphony and ICE and extracts RFQs, orders and market sentiment from broker
  chat, delivering them to the desk through an AI-Enhanced Blotter and a
  Quotebook that feeds structured market data to algo models and alerts. The
  product supports multiple asset classes (Fixed Income, Commodities) and
  languages with claimed 95%+ accuracy. API access — a batch processing API and
  WebSocket streaming endpoints secured with SSO and role-based access control —
  is offered to enterprise customers but is gated behind a sales/onboarding
  contact, so no public OpenAPI specification is published. Sense Street is a
  portfolio company of Seedcamp and Speedinvest.
