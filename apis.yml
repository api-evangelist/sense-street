name: Sense Street
description: >-
  Sense Street provides production-grade AI workflow automation for capital
  markets, structuring unstructured OTC trading conversations in real time. Its
  platform connects to trading communication channels such as Bloomberg,
  Symphony, ICE and Eikon and extracts RFQs, orders, quotes and market sentiment
  from broker chat, delivering them to the desk through an AI-Enhanced Blotter
  and a Quotebook that feeds structured market data to algo models and alerts.
  The product supports multiple asset classes (Fixed Income, Commodities) and
  languages with claimed 95%+ precision. Sense Street ships a real REST API — a
  batch processing API under /api/v1 plus a WebSocket streaming API for
  commodity quote feeds — and publishes a first-party, actively maintained
  Python client to PyPI. The API contract itself is not public: the OpenAPI
  exists but is issued to customers, the documentation pages are listed publicly
  while their bodies require sign-in, and access requires a per-tenant host, VPN
  connectivity, allowlisted static IPs and a registered RSA key pair.
  Sense Street Limited is registered in London with an engineering office in
  Kraków, and is a portfolio company of Seedcamp and Speedinvest.
