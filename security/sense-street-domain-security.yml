  finding: expired-certificate
  finding_detail: >-
    The customer-facing Sense Street portal — the host that also serves the live
    /api/v1 surface — presents a Let's Encrypt certificate that expired on
    2026-05-03, more than three months before this probe. curl refuses the
    connection with exit 60 (certificate verify failed) and every browser will
    interstitial. This is the single most material security finding on the
    domain, and it is trivially fixable: the same wildcard was renewed on the
    Framer-hosted marketing hosts but not here.
  hsts: false
  hsts_note: >-
    No Strict-Transport-Security header on the portal, unlike the marketing and
    docs hosts which both set max-age=31536000.
