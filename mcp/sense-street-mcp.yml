agent_readiness_note: >-
  Even if a server existed, this API is not reachable by a general agent: the
  host is a per-tenant subdomain issued at onboarding, calls must originate from
  a VPN with an allowlisted static IP, and every request must carry a JWT signed
  by a private key Sense Street has registered. Any MCP server for Sense Street
  would necessarily be customer-deployed inside the tenant's own network.
